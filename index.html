<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <base href="/cubeygdps-demonlist/" />
        <title>CubeyGDPS Demon List</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="css/reset.css" />
        <link rel="stylesheet" type="text/css" href="css/typography.css" />
        <link rel="stylesheet" type="text/css" href="css/main.css" />
        <link rel="stylesheet" type="text/css" href="css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="css/components/tabs.css"
        />
        <style>
            .submission-modal {
                position: fixed !important;
                top: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                z-index: 99999 !important;
                display: none !important;
                align-items: center !important;
                justify-content: center !important;
                box-sizing: border-box;
                padding: 20px !important;
                margin: 0 !important;
                background: rgba(0, 0, 0, 0.65) !important;
            }

            .submission-modal.is-open {
                display: flex !important;
            }

            .submission-modal[hidden] {
                display: none !important;
            }

            .submission-modal__box {
                position: relative;
                width: min(560px, 100%);
                max-height: calc(100vh - 40px);
                overflow: auto;
                box-sizing: border-box;
                padding: 30px;
                border-radius: 14px;
                background: #fff;
                color: #222;
                box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
                font-family: "Lexend Deca", sans-serif;
                font-weight: 500;
                -webkit-font-smoothing: subpixel-antialiased;
            }

            .submission-modal__close {
                position: absolute;
                top: 12px;
                right: 16px;
                border: 0;
                background: transparent;
                font-family: "Lexend Deca", sans-serif;
                font-size: 28px;
                line-height: 1;
                font-weight: 500;
                cursor: pointer;
            }

            .submission-modal__box h2 {
                margin: 0 35px 12px 0;
            }

            .submission-modal__box p {
                font-family: "Lexend Deca", sans-serif;
                font-size: 17.1428571429px;
                line-height: 28px;
                font-weight: 500;
            }

            .submission-modal__box ul {
                margin: 14px 0 24px;
                padding-left: 24px;
                font-family: "Lexend Deca", sans-serif;
                font-size: 17.1428571429px;
                line-height: 28px;
                font-weight: 500;
            }

            .submission-modal__actions {
                display: flex;
                justify-content: flex-end;
                gap: 10px;
                margin-top: 24px;
            }

            .submission-modal__button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 42px;
                padding: 0 18px;
                border: 0;
                border-radius: 8px;
                font-family: "Lexend Deca", sans-serif;
                font-size: 17.1428571429px;
                line-height: 20px;
                font-weight: 500;
                cursor: pointer;
                text-decoration: none;
                box-sizing: border-box;
            }

            .submission-modal__button--close {
                background: #e7e7e7;
                color: #222;
            }

            .submission-modal__button--discord {
                background: #5865f2;
                color: #fff;
            }
        </style>
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>CubeyGDPS Demon List</h2>
                <p>v1.0.0</p>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <div class="nav__actions">
                    <button
                        class="nav__icon"
                        @click.prevent="store.toggleDark()"
                    >
                        <img
                            :src="store.dark ? 'assets/light.svg' : 'assets/dark.svg'"
                            alt=""
                        />
                    </button>
                    <a
                        class="nav__icon"
                        href="https://discord.com/invite/V8VujbJnUS"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <img src="assets/discord.svg" alt="Discord Logo" />
                    </a>
                    <a
                        class="nav__cta type-label-lg"
                        href="#"
                        id="submit-record-button"
                    >Submit Record</a>
                </div>
            </nav>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>
    </body>
</html>
